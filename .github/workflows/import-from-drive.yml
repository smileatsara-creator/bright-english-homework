name: One-time import from Drive
on:
  push:
    paths: ['tools/import-manifest.txt']
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify
        run: |
          set -euo pipefail
          while read -r id size path; do
            [ -z "$id" ] && continue
            mkdir -p "$(dirname "$path")"
            curl -fsSL -o "$path" "https://drive.usercontent.google.com/download?id=${id}&export=download&confirm=t"
            got=$(stat -c %s "$path")
            head -c 4 "$path" | grep -q '%PDF' || { echo "NOT A PDF: $path"; exit 1; }
            [ "$got" = "$size" ] || { echo "SIZE MISMATCH $path: got $got expected $size"; exit 1; }
            echo "OK $path $got"
          done < tools/import-manifest.txt
          sha256sum snakes-and-ladders/*.pdf kita-vav/*.pdf > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add snakes-and-ladders kita-vav SHA256SUMS.txt
          git commit -m "Add 13 snakes-and-ladders boards and week 4 Luna homework (copied from Drive, sizes verified)"
          git push
